  <circle cx="48" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="21" r="6" fill="#27c93f"/>

  <!-- Title bar text -->
  <text x="430" y="26" font-family="Courier New, monospace" font-size="12" fill="white" text-anchor="middle">zahrah@github ~ %  ./profile.sh --theme=pink</text>

  <!-- Pink vertical divider -->
  <line x1="195" y1="50" x2="195" y2="295" stroke="#ff1493" stroke-width="1" opacity="0.6"/>

