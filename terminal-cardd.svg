  <text x="30" y="134" font-family="Courier New, monospace" font-size="16" fill="#ff69b4">/ &gt;  </text>
  <text x="62" y="134" font-family="Courier New, monospace" font-size="14" fill="#ff69b4">&#128187;</text>

  <!-- RIGHT: Profile labels (pink) -->
  <text x="215" y="76"  font-family="Courier New, monospace" font-size="13" fill="#ff69b4">&#127800; Name</text>
  <text x="215" y="101" font-family="Courier New, monospace" font-size="13" fill="#ff69b4">&#127872; Role</text>
  <text x="215" y="126" font-family="Courier New, monospace" font-size="13" fill="#ff69b4">&#127891; Major</text>
  <text x="215" y="151" font-family="Courier New, monospace" font-size="13" fill="#ff69b4">&#127979; College</text>
  <text x="215" y="176" font-family="Courier New, monospace" font-size="13" fill="#ff69b4">&#128205; Location</text>
  <text x="215" y="201" font-family="Courier New, monospace" font-size="13" fill="#ff69b4">&#9889; Stack</text>
