  <text x="215" y="251" font-family="Courier New, monospace" font-size="13" fill="#ff69b4">&#128150; Status</text>

  <!-- RIGHT: Profile values (white) -->
  <text x="360" y="76"  font-family="Courier New, monospace" font-size="13" fill="#ffffff">: Zahrah Aliyah</text>
  <text x="360" y="101" font-family="Courier New, monospace" font-size="13" fill="#ffffff">: Fullstack Developer &amp; UI/UX Designer</text>
  <text x="360" y="126" font-family="Courier New, monospace" font-size="13" fill="#ffffff">: Information Systems</text>
  <text x="360" y="151" font-family="Courier New, monospace" font-size="13" fill="#ffffff">: UPN Veteran Jawa Timur</text>
  <text x="360" y="176" font-family="Courier New, monospace" font-size="13" fill="#ffffff">: Surabaya, Indonesia</text>
  <text x="360" y="201" font-family="Courier New, monospace" font-size="13" fill="#ffffff">: Laravel · React · Tailwind · MySQL</text>
  <text x="360" y="226" font-family="Courier New, monospace" font-size="13" fill="#ffffff">: 3.94 / 4.00</text>
