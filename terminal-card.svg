<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d0a20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a18;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff1493;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff69b4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff1493;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff69b4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff1493;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow border -->
  <rect x="2" y="2" width="856" height="316" rx="14" ry="14" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Main background -->
  <rect x="4" y="4" width="852" height="312" rx="12" ry="12" fill="url(#bgGrad)"/>

  <!-- Title bar -->
  <rect x="4" y="4" width="852" height="38" rx="12" ry="12" fill="#ff1493" opacity="0.85"/>
  <rect x="4" y="24" width="852" height="18" fill="#ff1493" opacity="0.85"/>

  <!-- Window buttons -->
  <circle cx="30" cy="23" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="23" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="23" r="6" fill="#27c93f"/>

  <!-- Title bar text -->
  <text x="430" y="28" font-family="'Courier New', monospace" font-size="13" fill="white" text-anchor="middle" opacity="0.95">✨ zahrah@github ~ % ./profile.sh --theme=pink 🌸</text>

  <!-- LEFT SIDE: Cute Bunny ASCII + divider -->
  <text x="55" y="85" font-family="'Courier New', monospace" font-size="15" fill="#ff69b4" filter="url(#glow)">  (\__/)</text>
  <text x="55" y="108" font-family="'Courier New', monospace" font-size="15" fill="#ff69b4" filter="url(#glow)">  (•ᴗ• )</text>
  <text x="55" y="131" font-family="'Courier New', monospace" font-size="15" fill="#ff69b4" filter="url(#glow)">  / >💻</text>

  <!-- Glowing vertical divider line -->
  <line x1="200" y1="55" x2="200" y2="295" stroke="#ff1493" stroke-width="1.5" opacity="0.5"/>

  <!-- RIGHT SIDE: Profile Info -->
  <!-- Name -->
  <text x="225" y="85" font-family="'Courier New', monospace" font-size="14" fill="#ff69b4">🌸</text>
  <text x="248" y="85" font-family="'Courier New', monospace" font-size="14" fill="#ffb6c1" font-weight="bold"> Name     </text>
  <text x="370" y="85" font-family="'Courier New', monospace" font-size="14" fill="#ffffff">: Zahrah Aliyah</text>

  <!-- Role -->
  <text x="225" y="110" font-family="'Courier New', monospace" font-size="14" fill="#ff69b4">🎀</text>
  <text x="248" y="110" font-family="'Courier New', monospace" font-size="14" fill="#ffb6c1" font-weight="bold"> Role     </text>
  <text x="370" y="110" font-family="'Courier New', monospace" font-size="14" fill="#ffffff">: Fullstack Dev &amp; UI/UX Designer</text>

  <!-- College -->
  <text x="225" y="135" font-family="'Courier New', monospace" font-size="14" fill="#ff69b4">🎓</text>
  <text x="248" y="135" font-family="'Courier New', monospace" font-size="14" fill="#ffb6c1" font-weight="bold"> Major    </text>
  <text x="370" y="135" font-family="'Courier New', monospace" font-size="14" fill="#ffffff">: Information Systems</text>

  <!-- University -->
  <text x="225" y="160" font-family="'Courier New', monospace" font-size="14" fill="#ff69b4">🏫</text>
  <text x="248" y="160" font-family="'Courier New', monospace" font-size="14" fill="#ffb6c1" font-weight="bold"> College  </text>
  <text x="370" y="160" font-family="'Courier New', monospace" font-size="14" fill="#ffffff">: UPN Veteran Jawa Timur</text>

  <!-- Location -->
  <text x="225" y="185" font-family="'Courier New', monospace" font-size="14" fill="#ff69b4">📍</text>
  <text x="248" y="185" font-family="'Courier New', monospace" font-size="14" fill="#ffb6c1" font-weight="bold"> Location </text>
  <text x="370" y="185" font-family="'Courier New', monospace" font-size="14" fill="#ffffff">: Surabaya, Indonesia 🇮🇩</text>

  <!-- Stack -->
  <text x="225" y="210" font-family="'Courier New', monospace" font-size="14" fill="#ff69b4">⚡</text>
  <text x="248" y="210" font-family="'Courier New', monospace" font-size="14" fill="#ffb6c1" font-weight="bold"> Stack    </text>
  <text x="370" y="210" font-family="'Courier New', monospace" font-size="14" fill="#ffffff">: Laravel · React · Tailwind · MySQL</text>

  <!-- GPA -->
  <text x="225" y="235" font-family="'Courier New', monospace" font-size="14" fill="#ff69b4">⭐</text>
  <text x="248" y="235" font-family="'Courier New', monospace" font-size="14" fill="#ffb6c1" font-weight="bold"> GPA      </text>
  <text x="370" y="235" font-family="'Courier New', monospace" font-size="14" fill="#ffffff">: 3.94 / 4.00</text>

  <!-- Status -->
  <text x="225" y="260" font-family="'Courier New', monospace" font-size="14" fill="#ff69b4">💖</text>
  <text x="248" y="260" font-family="'Courier New', monospace" font-size="14" fill="#ffb6c1" font-weight="bold"> Status   </text>
  <text x="370" y="260" font-family="'Courier New', monospace" font-size="14" fill="#ff69b4" filter="url(#glow)">: Open For Work ✨</text>

  <!-- Bottom blinking cursor line -->
  <text x="225" y="290" font-family="'Courier New', monospace" font-size="13" fill="#ff1493" opacity="0.7">$ _</text>

  <!-- Corner decorations -->
  <text x="800" y="85" font-family="Arial" font-size="28" fill="#ff1493" opacity="0.15">🌸</text>
  <text x="800" y="285" font-family="Arial" font-size="28" fill="#ff1493" opacity="0.15">🌸</text>
  <text x="20" y="285" font-family="Arial" font-size="28" fill="#ff1493" opacity="0.15">🌸</text>
</svg>
